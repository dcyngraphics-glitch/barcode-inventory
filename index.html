<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Scan barcodes, track inventory, get expiry notifications" />

    <!-- Installability / standalone shell. Without these the app opens in browser
         chrome even when launched from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarInv" />
    <meta name="color-scheme" content="dark light" />

    <!-- Content-Security-Policy. GitHub Pages and Vercel do not let us set response
         headers without extra config, so this meta tag carries the policy; it is
         partial protection only. frame-ancestors is deliberately omitted: the
         directive is ignored when delivered via <meta> (browsers warn about it), and
         clickjacking protection genuinely belongs in a real response header.
         style-src must allow fonts.googleapis.com because src/index.css @imports the
         Inter / SF Mono stylesheet; font-src must allow fonts.gstatic.com for the
         font files that stylesheet points at. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' https://world.openfoodfacts.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://zo7vbabeq.dexie.cloud https://world.openfoodfacts.org;">

    <!-- 180x180 is the iOS home-screen size; the previous value (/icon-192.png)
         404'd because no such file existed, so iOS fell back to a screenshot. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Theme pre-load before the app boots, so there is no flash of the wrong
         theme on cold start. Kept as a separate file so the HTML can declare a
         Content-Security-Policy without needing 'unsafe-inline' for scripts. -->
    <script src="/theme-preload.js" defer></script>
    <title>Barcode Inventory</title>
  </head>
  <body>
    <!-- React mounts here. This element must exist in the production HTML: without
         it createRoot(null) throws React error #299 and the page renders blank. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
