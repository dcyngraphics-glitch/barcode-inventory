<!DOCTYPE html>
<html lang="en">

<link rel="stylesheet" crossorigin href="/barcode-inventory/assets/index-DHY4VU3f.css">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/barcode-inventory/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Scan barcodes, track inventory, get expiry notifications" />

    <!-- Installability / standalone shell. Without these the app opens in browser
         chrome even when launched from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarInv" />
    <meta name="color-scheme" content="dark light" />

    <!-- Content-Security-Policy: tell the browser to block inline scripts/styles
         and unsafe-eval. The theme-preload.js is referenced by src, so it's allowed.
         NOTE: GitHub Pages & Vercel do not set custom CSP headers by default — this
         meta tag only partial protection. For full protection, set these headers in
         your hosting config (GitHub Pages: _config.yml; Vercel: headers field). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' https://world.openfoodfacts.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://zo7vbabeq.dexie.cloud https://world.openfoodfacts.org; frame-ancestors 'none';">

    <!-- 180x180 is the iOS home-screen size; the previous value (/icon-192.png)
         404'd because no such file existed, so iOS fell back to a screenshot. -->
    <link rel="apple-touch-icon" href="/barcode-inventory/apple-touch-icon.png" />
    <!-- Theme pre-load before the app boots, so there is no flash of the wrong
         theme on cold start. Kept as a separate file so the HTML can declare a
         Content-Security-Policy without needing 'unsafe-inline' for scripts. -->
    <script src="/barcode-inventory/theme-preload.js" defer></script>
    <title>Barcode Inventory</title>
